# 仅供参考；现行部署/选版以 homelab-infra 清单及 Ansible 为准，不得直接覆盖或执行。
name: homelab-ezbookkeeping
services:
  ezbookkeeping:
    image: ${HOMELAB_EZBOOKKEEPING_IMAGE:?set the locked full registry reference@sha256:digest}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "10.144.144.2:18882:8080"
    environment:
      EBK_CONF_PATH: /run/ezbookkeeping/ezbookkeeping.ini
    volumes:
      - /etc/homelab/ezbookkeeping/ezbookkeeping.ini:/run/ezbookkeeping/ezbookkeeping.ini:ro
      - /var/lib/homelab/ezbookkeeping/data:/ezbookkeeping/data
      - /var/lib/homelab/ezbookkeeping/storage:/ezbookkeeping/storage
      - /srv/homelab/ezbookkeeping/android:/ezbookkeeping/public/android:ro
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 128
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 30s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    labels: {org.homelab.managed-by: ansible, org.homelab.component: ezbookkeeping}
