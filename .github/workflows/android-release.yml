name: Android signed release
on:
  workflow_dispatch:
  push:
    branches: ['main', 'android/**']
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android-release.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-release.yml']
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned Gradle wrapper
        run: |
          printf '%s\n' '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          grep -Fx 'distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' android/gradle/wrapper/gradle-wrapper.properties
      - name: Install exact Android SDK
        run: |
          set -euo pipefail
          SDK_MANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test unsigned-source debug build without secrets
        working-directory: android
        run: bash ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
  build:
    needs: verify
    if: github.repository == 'fjzhangZzzzzz/ezbookkeeping' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/android-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned Gradle wrapper
        run: |
          printf '%s\n' '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          grep -Fx 'distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' android/gradle/wrapper/gradle-wrapper.properties
      - name: Install exact Android SDK
        run: |
          set -euo pipefail
          SDK_MANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Decode dedicated keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"
      - name: Lint and build signed native APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon --console=plain lintRelease assembleRelease
      - name: Verify exact APK and generate update metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_CERTIFICATE: 6fe857a17e79298dee70334a4900df8935312bf312ef9f9ad6a23897a9f3735d
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-signature.txt"
          "$TOOLS/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          env = os.environ
          signature = pathlib.Path(env['RUNNER_TEMP'], 'apk-signature.txt').read_text()
          certificates = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$', signature, re.M)
          assert len(certificates) == 1 and certificates[0].lower() == env['EXPECTED_CERTIFICATE']
          badging = pathlib.Path(env['RUNNER_TEMP'], 'apk-badging.txt').read_text()
          package = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", badging, re.M)
          assert package and package[1] == 'top.fjzhang233.books'
          version = package[3]
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          if env['EVENT_NAME'] == 'push':
              assert env['RELEASE_TAG'] == 'android-v' + version
          assert 'application-debuggable' not in badging
          min_sdk = re.search(r"^sdkVersion:'(\d+)'", badging, re.M)
          assert min_sdk and int(package[2]) > 0
          previous_tags = subprocess.check_output(
              ['git', 'tag', '--merged', 'HEAD', '--list', 'android-v*', '--sort=-version:refname'],
              text=True,
          ).splitlines()
          previous_tag = next((tag for tag in previous_tags if tag != env['RELEASE_TAG']), None)
          if env['RELEASE_TAG'].startswith('android-v') and previous_tag:
              previous_source = subprocess.check_output(
                  ['git', 'show', f'{previous_tag}:android/app/build.gradle.kts'],
                  text=True,
              )
              previous_code = re.search(r'\bversionCode\s*=\s*(\d+)', previous_source)
              assert previous_code and int(package[2]) > int(previous_code[1]), 'Android versionCode must increase'
          apk = pathlib.Path('android/app/build/outputs/apk/release/app-release.apk')
          output = pathlib.Path('android-release-artifact')
          output.mkdir()
          name = 'ezbookkeeping-android-' + version + '.apk'
          shutil.copyfile(apk, output / name)
          metadata = {'schemaVersion': 1, 'channel': 'stable', 'packageId': package[1],
              'versionName': version, 'versionCode': int(package[2]), 'minSdk': int(min_sdk[1]),
              'apkAssetName': name, 'apkSha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'signingCertificateSha256': certificates[0].lower(), 'sourceCommit': env['GITHUB_SHA']}
          (output / 'update.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with (output / 'SHA256SUMS').open('w') as sums:
              for path in sorted(output.iterdir()):
                  if path.name != 'SHA256SUMS':
                      sums.write(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
          PY
          python3 scripts/release/validate_android_update.py android-release-artifact \
            --release-tag "$RELEASE_TAG" --source-commit "$GITHUB_SHA"
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-signed-${{ github.sha }}
          path: android-release-artifact/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build, upgrade-regression]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-signed-${{ github.sha }}
          path: android-release-artifact
      - name: Publish new immutable Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: android-release-artifact
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/release/validate_android_update.py" "$GITHUB_WORKSPACE/android-release-artifact" \
            --release-tag "$RELEASE_TAG" --source-commit "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --title "ezBookkeeping Family Android ${RELEASE_TAG#android-v}" --notes "Native Kotlin/Compose Android client. Android verifies the dedicated release signing identity; see update.json and SHA256SUMS." -- *.apk update.json SHA256SUMS

  upgrade-regression:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-signed-${{ github.sha }}
          path: android-release-artifact
      - name: Install emulator image
        run: |
          set -euo pipefail
          SDK_MANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          AVD_MANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/avdmanager"
          timeout 12m "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" platform-tools emulator 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64'
          echo no | "$AVD_MANAGER" create avd --force --name family-upgrade --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
      - name: Start emulator and run upgrade regression
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR_LOG="$RUNNER_TEMP/family-upgrade-emulator.log"
          trap 'timeout 30s "$ADB" -s emulator-5554 emu kill >/dev/null 2>&1 || true' EXIT
          "$ADB" kill-server >/dev/null 2>&1 || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd family-upgrade -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          if ! timeout 5m "$ADB" wait-for-device; then
            cat "$EMULATOR_LOG"
            exit 1
          fi
          BOOT_DEADLINE=$((SECONDS + 5 * 60))
          until BOOT_COMPLETED="$(timeout 30s "$ADB" shell getprop sys.boot_completed | tr -d '\r')" && grep -m 1 -q '1' <<< "$BOOT_COMPLETED"; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null || (( SECONDS >= BOOT_DEADLINE )); then
              cat "$EMULATOR_LOG"
              exit 1
            fi
            sleep 2
          done
          timeout 30s "$ADB" shell settings put global window_animation_scale 0
          timeout 30s "$ADB" shell settings put global transition_animation_scale 0
          timeout 30s "$ADB" shell settings put global animator_duration_scale 0
          timeout 5m python3 scripts/release/android_upgrade_regression.py android-release-artifact \
            --baseline-url 'https://github.com/fjzhangZzzzzz/ezbookkeeping/releases/download/android-v0.1.8/ezbookkeeping-family-android-0.1.8.apk' \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --adb "$ADB"
