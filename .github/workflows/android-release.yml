name: Android Release

on:
  push:
    tags:
      - 'android-v*.*.*'

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'fjzhangZzzzzz/ezbookkeeping'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify pinned Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          grep -Fx 'distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install exact Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Decode dedicated keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintRelease assembleRelease

      - name: Prepare and validate release artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --merged HEAD --list 'android-v*' --sort=-version:refname | awk -v current="$RELEASE_TAG" '$0 != current { print; exit }')"
          test -n "$previous_tag"
          previous_code="$(git show "$previous_tag:android/app/build.gradle.kts" | sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -n 1)"
          test -n "$previous_code"
          python3 scripts/release/prepare_android_release.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --output-dir android-release-artifact \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --release-tag "$RELEASE_TAG" \
            --source-commit "$GITHUB_SHA" \
            --previous-version-code "$previous_code"
          python3 scripts/release/validate_android_update.py android-release-artifact \
            --release-tag "$RELEASE_TAG" --source-commit "$GITHUB_SHA"

      - name: Remove runner signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-release.p12"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-release-signed-${{ github.sha }}
          path: android-release-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'fjzhangZzzzzz/ezbookkeeping'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: android-release-signed-${{ github.sha }}
          path: android-release-artifact

      - name: Verify artifact and publish immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd android-release-artifact
          sha256sum --check SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/release/validate_android_update.py" . \
            --release-tag "$RELEASE_TAG" --source-commit "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "ezBookkeeping Family Android ${RELEASE_TAG#android-v}" \
            --notes "Native Kotlin/Compose Android client. The release includes the stable OTA filename, update metadata and SHA256SUMS." \
            --repo "$GH_REPO" -- *.apk update.json SHA256SUMS
