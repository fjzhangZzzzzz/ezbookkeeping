name: Release Retention

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-retention.yml'
      - 'scripts/release/check_release_retention.py'
      - 'scripts/release/test_release_retention.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-retention.yml'
      - 'scripts/release/check_release_retention.py'
      - 'scripts/release/test_release_retention.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test retention rules
        run: python3 -B -m unittest discover -s scripts/release -p test_release_retention.py

      - name: Check published Releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 -B scripts/release/check_release_retention.py \
            | tee -a "$GITHUB_STEP_SUMMARY"
